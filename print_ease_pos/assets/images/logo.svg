<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A6B"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
  </defs>

  <!-- Badge ring -->
  <circle cx="250" cy="210" r="115" fill="none" stroke="url(#badgeGrad)" stroke-width="4"/>

  <!-- Inner ring detail -->
  <circle cx="250" cy="210" r="108" fill="none" stroke="#0A192F" stroke-width="1" opacity="0.12"/>

  <!-- Printer base -->
  <rect x="195" y="250" width="110" height="38" rx="5" fill="url(#badgeGrad)"/>

  <!-- Paper slot groove -->
  <rect x="215" y="250" width="70" height="4" rx="2" fill="#1A3A6B" opacity="0.5"/>

  <!-- Receipt paper -->
  <rect x="218" y="155" width="64" height="98" rx="3" fill="white"/>
  <rect x="218" y="155" width="64" height="98" rx="3" fill="none" stroke="#0A192F" stroke-width="1.5"/>

  <!-- Receipt tear line -->
  <path d="M218 253 L223 246 L228 253 L233 246 L238 253 L243 246 L248 253 L253 246 L258 253 L263 246 L268 253 L273 246 L282 253" fill="none" stroke="#0A192F" stroke-width="1.5"/>

  <!-- Receipt printed lines -->
  <rect x="232" y="170" width="36" height="3" rx="1.5" fill="#0A192F"/>
  <rect x="232" y="182" width="28" height="3" rx="1.5" fill="#0A192F"/>
  <rect x="232" y="194" width="36" height="3" rx="1.5" fill="#0A192F"/>
  <rect x="232" y="206" width="22" height="3" rx="1.5" fill="#0A192F"/>
  <rect x="232" y="220" width="36" height="3" rx="1.5" fill="#0A192F"/>

  <!-- Barcode -->
  <g fill="#0A192F">
    <rect x="232" y="230" width="3" height="12" rx="1"/>
    <rect x="238" y="230" width="6" height="12" rx="1"/>
    <rect x="247" y="230" width="2" height="12" rx="0.5"/>
    <rect x="252" y="230" width="5" height="12" rx="1"/>
    <rect x="260" y="230" width="3" height="12" rx="1"/>
    <rect x="266" y="230" width="4" height="12" rx="1"/>
  </g>

  <!-- LED indicator -->
  <circle cx="210" cy="272" r="3" fill="#1976D2"/>

  <!-- Wordmark -->
  <text x="250" y="395" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" fill="#0A192F" letter-spacing="7">PRINT EASE</text>
  <text x="250" y="432" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1976D2" letter-spacing="14">POS</text>
</svg>
