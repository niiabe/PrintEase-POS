name: print_ease_pos
description: "PrintEase POS - Thermal receipt printing made easy."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.3
  print_bluetooth_thermal: ^1.2.0
  esc_pos_utils_plus: ^2.0.4
  image: ^4.8.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter_local_notifications: ^18.0.1
  open_filex: ^4.6.0
  permission_handler: ^11.3.1
  flutter_file_downloader: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
